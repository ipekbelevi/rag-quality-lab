# LLM quality gate: runs the eval suite and fails the build when mean scores drop below the gates.
#   pull_request      -> PR loop: golden set + agent (1 run per case) + safety, ~5-6 min, ~$0.40
#   schedule (weekly) -> reliability loop: agent and safety cases 3 times each
#   workflow_dispatch -> run manually from the Actions tab
# Required repository secrets: ANTHROPIC_API_KEY, OPENAI_API_KEY (the repo owner's own keys).
# Without them the llm-eval job fails on missing keys, not on quality (see README, "Disclaimer").
# Optional: LANGFUSE_PUBLIC_KEY, LANGFUSE_SECRET_KEY, LANGFUSE_HOST (traces tagged "ci")

name: LLM quality gate

on:
  pull_request:
    paths:
      - "app/**"
      - "data/**"
      - "evals/**"
      - "scripts/ci_eval.sh"
      - "requirements.txt"
      - ".github/workflows/llm-quality-gate.yml"
  # Weekly reliability run (agent and safety cases 3x each). NOTE: this workflow is DISABLED in the
  # original repository because no API-key secrets are configured there. To turn the pipeline on in
  # your copy: add the secrets, then `gh workflow enable "LLM quality gate"` (or Actions tab ->
  # LLM quality gate -> Enable workflow). The schedule then starts on its own.
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-quality-gate-${{ github.ref }}
  cancel-in-progress: true   # a new push to the PR cancels the old (paid) run

jobs:
  unit-tests:
    name: Unit tests (free, no API keys)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  llm-eval:
    name: LLM eval + quality gate
    needs: unit-tests
    # Secrets are not shared with PRs from forks: skip instead of failing
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST || 'https://cloud.langfuse.com' }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PYTHON: python
      LABEL: ci
      REPEATS: ${{ github.event_name == 'schedule' && '3' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run eval suite and quality gates
        run: ./scripts/ci_eval.sh

      - name: Job summary
        if: always()
        run: python -m evals.ci_summary --label ci >> "$GITHUB_STEP_SUMMARY"

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-results
          path: results/*_ci.json
          retention-days: 30
